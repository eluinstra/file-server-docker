services:
  file-server:
    image: eluinstra/file-server-pg:${FILE_SERVER_VERSION}
    depends_on:
      - file-server-postgres
    environment:
      jdbc_url: "jdbc:postgresql://file-server-postgres:5432/${FILE_SERVER_DB_NAME}"
      jdbc_username: "${FILE_SERVER_DB_USER}"
      jdbc_password: "${FILE_SERVER_DB_PASSWORD}"
    # SOAP/REST authentication is mandatory since 2.1.2; provide a demo realm so the
    # server starts non-interactively. Rebuild the image from source for this to apply;
    # the prebuilt 2.1.1 image has no auth (see examples README). DEMO credentials only.
    volumes:
      - ./realm.properties:/home/user/realm.properties
    command: "./start.sh"
    expose:
      - 8443
      - 8080
    ports:
      - "8080:8080"
  file-server-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${FILE_SERVER_DB_USER}
      POSTGRES_PASSWORD: ${FILE_SERVER_DB_PASSWORD}
      POSTGRES_DB: ${FILE_SERVER_DB_NAME}
    # ports:
    #   - "5432:5432"
    # volumes:
    #   - ./data:/var/lib/postgresql/data
  file-client:
    image: eluinstra/file-client-pg:${FILE_CLIENT_VERSION}
    depends_on:
      - file-client-postgres
    environment:
      jdbc_url: "jdbc:postgresql://file-client-postgres:5432/${FILE_CLIENT_DB_NAME}"
      jdbc_username: "${FILE_CLIENT_DB_USER}"
      jdbc_password: "${FILE_CLIENT_DB_PASSWORD}"
    command: "./start.sh"
    expose:
      - 8443
      - 8080
    ports:
      - "8000:8080"
  file-client-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${FILE_CLIENT_DB_USER}
      POSTGRES_PASSWORD: ${FILE_CLIENT_DB_PASSWORD}
      POSTGRES_DB: ${FILE_CLIENT_DB_NAME}
    # ports:
    #   - "5432:5432"
    # volumes:
    #   - ./data:/var/lib/postgresql/data
